name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Native build deps (BLE, USB)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libbluetooth-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
